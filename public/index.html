<html lang="es">
<head>

  <title>Mis tareas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <h1>Gestor de tareas</h1>

    <ul id="lista"></ul>
  </main>
  <script src="js/app.js"></script>

</html>
